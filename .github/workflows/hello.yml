name: Hello Pipeline

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "Hello from GitHub Actions"

      - name: Show the runner machine
        run: |
          uname -a
          ls -la
